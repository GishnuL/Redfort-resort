    <!-- ── LCP hero image: start the download during HTML parse, before the
         JS bundle executes. Stable /public URL so the hash never breaks it. ── -->
    <link
      rel="preload"
      as="image"
      href="/outlook.webp"
      imagesrcset="/outlook-480.webp 480w, /outlook-768.webp 768w, /outlook.webp 985w"
      imagesizes="100vw"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- ── Fonts (self-hosted, latin woff2) ───────────────────────────
         @font-face declarations live in src/fonts.css (bundled into the app
         CSS). Both families are variable fonts, so one file each covers the
         400–700 range. These two above-the-fold faces are preloaded so they
         start downloading during HTML parse — same-origin, with no third-party
         preconnect/DNS/TLS handshake and no render-blocking CSS round trip.
         `crossorigin` is required: fonts are always fetched in CORS mode, so
         without it the preload would not match the actual request. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/outfit-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/cormorant-garamond-latin.woff2"
      crossorigin
    />
